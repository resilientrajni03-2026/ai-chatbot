services:
  - type: web
    name: ai-chatbot-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:backend
    startCommand: npm run db:migrate && npm --workspace backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_URL
        value: https://resilientrajni03-2026.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: ai-chatbot-db
          property: connectionString

databases:
  - name: ai-chatbot-db
    plan: free
    region: singapore
    databaseName: ai_chatbot
